[package]
name = "zenos"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "kernel",
    "kernel/crates/mm",
    "kernel/kapi",
    "kernel/crates/macros",
    "kernel/crates/vendors/uacpi-sys",
    "kernel/crates/scheduler",
    "kernel/crates/buses/*",
    "kernel/crates/drivers/*",
    "zenos-bootloader",
    "zenos-bootloader/api",
    "zenos-bootloader/common",
    "zenos-bootloader/common/config",
    "zenos-bootloader/uefi",
    "zenos-init",
    "zenos-fuzz",
]

[workspace.package]
version = "0.1.0"
repository = "https://github.com/BindraAgamjot256/zenos"
license = "MIT"

[workspace.dependencies]
kernel = { version = "0.1.0", path = "kernel" }
scheduler = { version = "0.1.0", path = "kernel/crates/scheduler" }
bootloader_api = { version = "0.1.0", path = "zenos-bootloader/api" }
bootloader-x86_64-common = { version = "0.1.0", path = "zenos-bootloader/common" }
bootloader-boot-config = { version = "0.1.0", path = "zenos-bootloader/common/config" }
kapi = { version = "0.1.0", path = "kernel/kapi" }
kmm = { version = "0.1.0", path = "kernel/crates/mm" }
uacpi-sys = { version = "0.1.0", path = "kernel/crates/vendors/uacpi-sys" }
kernel-macros = { version = "0.1.0", path = "kernel/crates/macros" }
zenos-bootloader = { path = "zenos-bootloader" }
stabby = { version = "72.1.16", default-features = false, features = [
    "alloc-rs",
] }


[dependencies]
ovmf-prebuilt = "0.1.0-alpha.1"
zenos-bootloader = { workspace = true }
clap = { version = "4.5.48", features = ["derive"] }
paste = "1.0.15"

[profile.release]
debug-assertions = false
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 2
debug-assertions = true
