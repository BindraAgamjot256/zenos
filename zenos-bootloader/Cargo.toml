[package]
name = "zenos-bootloader"
description = "An experimental x86_64 bootloader that works on UEFI systems."
edition = "2024"

[features]
default = ["uefi"]
uefi = ["dep:gpt"]

[dependencies]
anyhow = "1.0.32"
fatfs = { version = "0.3.4", default-features = false, features = [
    "std",
    "alloc",
] }
gpt = { version = "3.0.0", optional = true }
bootloader-boot-config = { workspace = true }
serde_json = "1.0.91"
tempfile = "3.20.0"



[build-dependencies]
llvm-tools = "0.1.1"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs_dummy_build"]
