[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[features]
default = ["acpi", "disable_int_on_lock"]
acpi = ["dep:uacpi-sys", "dep:driver-acpi"]
# ps2k = ["dep:driver-ps2k"]
__test_timer = []
__test_mutex = []
disable_int_on_lock = ["kapi/disable_int_on_lock"]

[dependencies]
kapi = { workspace = true }
driver-acpi = { path = "crates/buses/acpi", optional = true }
# driver-ps2k = { path = "crates/drivers/ps2k", optional = true }
scheduler = { workspace = true }
kmm = { workspace = true }
uacpi-sys = { workspace = true, optional = true }
kernel-macros = { workspace = true }
bootloader_api = { workspace = true }
stabby = { workspace = true }

log = { version = "0.4", default-features = false }
bitflags = { version = "2.11.1", default-features = false }
uuid = { version = "1.26.0", default-features = false, features = ["v5"] }
linked_list_allocator = { version = "0.10.0" }                             # TODO: vmalloc implementation instead of this.

[[bin]]
name = "kernel"
